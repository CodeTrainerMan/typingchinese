name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    name: lint / test / build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      # 语言包与核心逻辑的回归：漏 key、判定串、流程编排、备份导入
      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      # 类型检查由 build 顺带完成（Next 会在构建前跑 tsc）
      - name: Build
        run: npm run build
